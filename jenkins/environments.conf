# Indistylex deploy environments — sourced by jenkins/deploy.sh and Jenkinsfile
# Single-server setup: staging uses develop branch, production uses main (same app dir).

PRODUCTION_HOST="${PRODUCTION_HOST:-138.201.50.228}"
PRODUCTION_USER="${PRODUCTION_USER:-root}"
PRODUCTION_SSH_CREDENTIAL_ID="${PRODUCTION_SSH_CREDENTIAL_ID:-indistylex-server-ssh}"

GIT_REMOTE="${GIT_REMOTE:-shivam74826}"
APP_DIR="${APP_DIR:-/var/www/html/indistylex}"
VENV_DIR="${VENV_DIR:-${APP_DIR}/venv}"

# --- development (local CI on laptop) ---
DEV_BRANCH="${DEV_BRANCH:-develop}"
DEV_RUN_TESTS="${DEV_RUN_TESTS:-true}"

# --- staging (pre-production on server) ---
STAGING_BRANCH="${STAGING_BRANCH:-develop}"
STAGING_APP_DIR="${STAGING_APP_DIR:-/var/www/html/indistylex}"
STAGING_SERVICE="${STAGING_SERVICE:-indistylex}"
STAGING_HEALTH_URL="${STAGING_HEALTH_URL:-http://127.0.0.1:8000/}"

# --- production (live site) ---
PRODUCTION_BRANCH="${PRODUCTION_BRANCH:-main}"
PRODUCTION_APP_DIR="${PRODUCTION_APP_DIR:-/var/www/html/indistylex}"
PRODUCTION_SERVICE="${PRODUCTION_SERVICE:-indistylex}"
PRODUCTION_HEALTH_URL="${PRODUCTION_HEALTH_URL:-http://127.0.0.1:8000/}"

# Deploy history file (one git SHA per line, newest last — used for rollback)
DEPLOY_HISTORY_FILE="${DEPLOY_HISTORY_FILE:-.deploy-history}"
